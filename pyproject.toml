[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorialju-batchdisc"
version = "0.1.0"
description = "按结构键把条目聚类，标出批处理折扣的适用性上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tutorialju" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tutorialju.github.io"
Repository = "https://github.com/tutorialju/batchdisc"
Issues = "https://github.com/tutorialju/batchdisc/issues"

[project.scripts]
batchdisc = "batchdisc:main"

[tool.setuptools]
py-modules = ["batchdisc"]
